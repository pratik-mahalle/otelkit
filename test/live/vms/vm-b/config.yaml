receivers:
  otlp:
    protocols:
      grpc: {endpoint: 0.0.0.0:4317}
      http: {endpoint: 0.0.0.0:4318}
  hostmetrics:
    collection_interval: 10s
    scrapers: {cpu: {}, memory: {}, filesystem: {}}
processors:
  memory_limiter: {check_interval: 1s, limit_percentage: 80, spike_limit_percentage: 20}
  resourcedetection: {detectors: [system]}
  batch: {timeout: 5s}
extensions:
  basicauth/server:
    htpasswd:
      inline: admin:SuperSecretPw
exporters:
  otlp:
    endpoint: gateway.example.internal:4317
service:
  pipelines:
    traces: {receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp]}
    metrics: {receivers: [otlp, hostmetrics], processors: [memory_limiter, resourcedetection, batch], exporters: [otlp]}
